# towncrier: each pull request's changelog entry in a file of its own under
# changes/, folded into CHANGELOG.md at a release (`towncrier build`), so no
# two pull requests ever edit the same lines. CONTRIBUTING.md says how.
[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## v{version} · {project_date}"
issue_format = "#{issue}"
orphan_prefix = "+"
ignore = ["README.md"]
wrap = false

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
