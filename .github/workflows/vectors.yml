name: vectors

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ports:
    # Every port, every vector, every box verified every way. compare.py skips
    # a port whose toolchain is missing and still exits 0, so this job checks
    # that each port actually ran: a leg that checked nothing fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: the vectors are kernel.py's as it is now
        run: |
          pip install pytest
          python -m pytest -q -p no:cacheprovider vectors/test_vectors.py -k "as_it_is_now"
      - name: every port answers every vector
        run: |
          python vectors/compare.py | tee compare.out
          for port in java ts csharp; do
            grep -Eq "^  $port +([0-9]+)/\1 session checks ok$" compare.out \
              || { echo "::error::$port did not run or did not pass"; exit 1; }
          done
          grep -q "^unexplained differences: 0$" compare.out
