name: kernel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.7
      - run: ruff check . && ruff format --check .

  tests:
    # kernel.py says 3.9+, so 3.9 is in the matrix, not assumed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python kernel.py test
      - run: pip install pytest
      # the ports run in vectors.yml, where a missing toolchain fails the job
      - run: >-
          python -m pytest -q -p no:cacheprovider
          test_kernel.py test_docs.py adapters vectors/test_vectors.py
          -k "not every_port"
