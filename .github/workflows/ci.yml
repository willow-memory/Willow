name: ci

# Every check is in adapters/stdlib/ci/ci.py, which writes each one as a verdict row
# on a kernel record. This file only installs the tools, runs one part per
# job, verifies the record, and keeps it as the run's artifact. The record
# lives in the runner's temp folder: never in the checkout it hashes.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  similar:
    # What's already on the add-on list near each idea or add-on this pull
    # request adds, written to the run's summary so a fork sees it too.
    # A suggestion, never a gate: similar.py's own check runs in the tests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - env:
          BASE: origin/${{ github.base_ref }}
        run: python adapters/stdlib/similar/similar.py new --base "$BASE" >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.7
      - run: python adapters/stdlib/ci/ci.py run lint --box ${{ runner.temp }}/ci-record
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-lint
          path: ${{ runner.temp }}/ci-record/record.jsonl

  tests:
    # kernel.py says 3.9+, so 3.9 is in the matrix, not assumed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python adapters/stdlib/ci/ci.py run tests --box ${{ runner.temp }}/ci-record
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-tests-${{ matrix.python-version }}
          path: ${{ runner.temp }}/ci-record/record.jsonl

  ports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python adapters/stdlib/ci/ci.py run ports --box ${{ runner.temp }}/ci-record
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-ports
          path: ${{ runner.temp }}/ci-record/record.jsonl

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python adapters/stdlib/ci/ci.py run demo --box ${{ runner.temp }}/ci-record
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-demo
          path: ${{ runner.temp }}/ci-record/record.jsonl

  deps:
    # Each add-on in adapters/deps gets a fresh virtual environment with only
    # its own pinned requirements, made by ci.py, then another at its floor;
    # deps:floors checks each floor against PyPI. mcp needs Python 3.10+.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python adapters/stdlib/ci/ci.py run deps --box ${{ runner.temp }}/ci-record
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-deps
          path: ${{ runner.temp }}/ci-record/record.jsonl
