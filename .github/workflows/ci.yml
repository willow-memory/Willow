name: ci

# Every check is in adapters/stdlib/ci/ci.py, which writes each one as a verdict row
# on a kernel record. This file only installs the tools, runs one part per
# job (tests and strip run four shards at once with cores.py), verifies the
# record, and keeps it as the run's artifact. The record
# lives in the runner's temp folder: never in the checkout it hashes.
on:
  push:
    branches: [main]
  pull_request:
  # GitHub's merge queue: each queued pull request is tested once more, on
  # main with every pull request ahead of it, before it merges
  merge_group:

# One run per change. A pull request's runs are its pull_request ones, not
# its branch's pushes as well, and a newer commit on it cancels the run it
# replaces: a run on a commit nobody will merge holds a runner every other
# pull request is queued behind. main's runs are never cancelled.
# adapters/stdlib/github/github.py check holds both.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The fast checks go first. lint, against and changelog take seconds; every
# heavier job `needs` them, so on a pull request they take the runners first
# and a failure among them stops the rest from queueing at all: a red lint or
# a duplicate add-on costs four jobs, not fourteen. first is not among them:
# it runs what a change reaches, which for a wide change is minutes (18 on a
# pull request converting seven add-ons), so it runs beside the rest as the
# early word it was meant to be. On main's commit two of the three don't
# run, so the heavy jobs say `!failure() && !cancelled()`: they wait for what
# ran and go on past what was skipped. mutants runs on main's commit only and
# waits on lint alone. Each job that runs a gate also needs `queued`, which on
# a push says whether the merge queue already ran this very commit, and
# stands down when it did.
#
# bash's own pipefail: each check below is piped through tee, for ci-why to
# read when it fails, and the step must still fail with it
defaults:
  run:
    shell: bash

jobs:
  similar:
    # What's already on the add-on list near each idea or add-on this pull
    # request adds, written to the run's summary so a fork sees it too, and
    # kept as the `similar` artifact, which willow-bot posts on the pull
    # request. A suggestion, never a gate: similar.py's own check runs in the
    # tests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - env:
          BASE: origin/${{ github.base_ref }}
        run: |
          python adapters/stdlib/similar/similar.py new --base "$BASE" > "$RUNNER_TEMP/similar.md"
          cat "$RUNNER_TEMP/similar.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: similar
          path: ${{ runner.temp }}/similar.md
          retention-days: 7

  copies:
    # The functions add-ons keep their own copy of that this pull request
    # leaves drifted from the rest without saying why, each with its diff
    # (adapters/stdlib/ci/copies.py), written to the run's summary and kept
    # as the `copies` artifact. A suggestion, never a gate: copies.py's own
    # tests run in the tests, and `copies.py survey` says every drift.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - env:
          BASE: origin/${{ github.base_ref }}
        run: |
          python adapters/stdlib/ci/copies.py new --base "$BASE" > "$RUNNER_TEMP/copies.md"
          cat "$RUNNER_TEMP/copies.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: copies
          path: ${{ runner.temp }}/copies.md
          retention-days: 7

  changelog:
    # A pull request that changes more than the docs adds a line under
    # CHANGELOG.md's Unreleased ending with its number (CONTRIBUTING.md).
    # Dependabot's can't write one, and its updates aren't listed: it alone
    # is skipped, which adapters/stdlib/github/github.py check holds.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - env:
          BASE: origin/${{ github.base_ref }}
          PR: ${{ github.event.number }}
        run: python adapters/stdlib/ci/changelog.py --base "$BASE" --pr "$PR"
      # each add-on and idea it changed steps its version, once
      # (CONTRIBUTING.md, Releases): the same base, the same pull request
      - env:
          BASE: origin/${{ github.base_ref }}
        run: python adapters/stdlib/ci/versions.py check --base "$BASE"

  against:
    # This pull request held to the other open ones (adapters/stdlib/against):
    # a name both add (an add-on, an idea, a COMMANDS key, a path in FILES.md)
    # fails it, a file both change that cannot be merged is named in the
    # summary with the pull request to merge first, and an idea near another's
    # is suggested. Only a duplicate fails, and a pull request stacks on
    # another only when this names one (CONTRIBUTING.md). Each open pull
    # request's head is fetched as refs/pull/N/head, which a fork's has too.
    # 42 is nothing to check, no other open or a head that couldn't be fetched:
    # the summary says which, and it passes. Anything but 0, 42 or a duplicate's
    # 2 is the check itself broken, and fails too.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - env:
          BASE: origin/${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          others=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number --jq ".[].number | select(. != $PR)")
          if [ -z "$others" ]; then
            echo "No other pull request is open: nothing to hold this one to." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          refs=()
          for n in $others; do
            git fetch -q origin "+refs/pull/$n/head:refs/remotes/pr/$n" || echo "could not fetch #$n"
            refs+=("refs/remotes/pr/$n")
          done
          set +e
          python adapters/stdlib/against/against.py check --base "$BASE" "$HEAD" "${refs[@]}" > "$RUNNER_TEMP/against.txt"
          code=$?
          { echo '### Against the open pull requests'; echo; echo '```'; cat "$RUNNER_TEMP/against.txt"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          # exit 2 is a duplicate: the job fails on it, and on a broken check
          [ "$code" = 0 ] || [ "$code" = 42 ]

  first:
    # The checks this pull request's change can reach, cheapest first,
    # stopping at the first that fails (adapters/stdlib/test-impact): a
    # failure shows in a minute or two instead of at the end. Every job below
    # still runs all of its part; this one replaces none of them.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest ruff==0.16.7
      # A change to ocr runs deps:ocr here, which needs tesseract, and one to
      # kart runs deps:kart, which needs bubblewrap, as the deps job below does.
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - env:
          BASE: origin/${{ github.base_ref }}
        # A change it can't place widens to every gate, which the jobs below
        # already run: then this says so and stops. 42 is a gate whose tool
        # isn't installed here (a port, say), which its own job installs.
        run: |
          python adapters/stdlib/test-impact/impact.py plan --base "$BASE" | tee "$RUNNER_TEMP/plan.txt"
          if grep -q ": running everything$" "$RUNNER_TEMP/plan.txt"; then
            echo "test-impact couldn't place this change, so it ran nothing: the other jobs run every gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          python adapters/stdlib/test-impact/impact.py run --base "$BASE" 2>&1 | tee "$RUNNER_TEMP/ci.log"
          code=${PIPESTATUS[0]}
          [ "$code" = 0 ] || [ "$code" = 42 ]
      - if: failure()
        run: python adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/ci.log" >> "$GITHUB_STEP_SUMMARY" || true

  queued:
    # A push to main is a commit the merge queue has already run, whole and
    # on every Python, as main with every pull request ahead of it: GitHub
    # moves main to the very commit the queue tested. So a push stands on
    # that run when it passed: every job here that runs a gate skips, and
    # what reads main's records (mutants-reach, deps, red-on-main, times.py)
    # finds the queue's run by adapters/stdlib/ci/main_run.py. A push the
    # queue didn't test, or one gh can't say of, runs every gate, as before.
    # github.py check holds each job that runs a gate to it.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: find
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event merge_group --commit "$GITHUB_SHA" --status success -L 1 --json databaseId -q '.[].databaseId' 2>/dev/null || true)
          if [ -n "$id" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "Stood on the merge queue's green run $id of this commit: no gate runs again here." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "No green merge-queue run of this commit to stand on: every gate runs here." >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    needs: [queued]
    if: ${{ !failure() && !cancelled() && needs.queued.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.7
      - run: python adapters/stdlib/ci/ci.py run lint --box ${{ runner.temp }}/ci-record | tee "$RUNNER_TEMP/ci.log"
      - if: failure()
        run: python adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/ci.log" --record "$RUNNER_TEMP/ci-record/record.jsonl" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-lint
          path: ${{ runner.temp }}/ci-record/record.jsonl

  tests:
    # kernel.py says 3.9+, so 3.9 is in the matrix, not assumed; a pull request
    # runs 3.9 and 3.14 only, since the six Pythons were 72 of its 84 jobs
    # behind a 20-job limit, and main's commit runs all six (in the merge
    # queue, or on the push when the queue didn't test it). Every gate of
    # the tests part but tests:strip, which the strip job runs beside it on
    # the same Pythons: it runs the add-ons' tests again in a copy without
    # GitHub, so in one job it doubled the time. github.py check holds the two
    # to the whole part, and to the same matrix.
    # One job on each Python, not a matrix of shards: the runner has four
    # cores and a job used one, and the job's wall time was its slowest gate
    # (about nine minutes) whatever the cut. cores.py runs ci.py's --shard
    # parts at once, four to a runner, so they end about together. A pull
    # request is 14 jobs, not 36, and main's commit 30, not 84, behind the
    # 20-job limit. tests:alone starts a pool of its own, a thread for each
    # core, so under four shards the cores are oversubscribed; that is slower
    # than it could be, not wrong, and alone.py is left as it is.
    needs: [queued, lint, against, changelog]
    if: ${{ !failure() && !cancelled() && needs.queued.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # A pull request runs the oldest and newest Python; main's commit
        # runs all six.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"python-version":"3.10"},{"python-version":"3.11"},{"python-version":"3.12"},{"python-version":"3.13"}]') || fromJSON('[]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      # cores.py verifies each record itself and refuses when one doesn't;
      # its records are ci-record/1 to ci-record/4, and its log has every
      # gate's verdict, which ci-why reads
      # on main, one Python writes each tests:adapters gate's times, for
      # adapters/stdlib/ci/times.py to keep test-times.json to
      - run: python adapters/stdlib/ci/cores.py --jobs 4 --box ${{ runner.temp }}/ci-record tests --without tests:strip | tee "$RUNNER_TEMP/ci.log"
        env:
          WILLOW_JUNIT_DIR: ${{ github.event_name != 'pull_request' && matrix.python-version == '3.13' && format('{0}/junit', runner.temp) || '' }}
      - if: failure()
        run: python adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/ci.log" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: for d in "$RUNNER_TEMP"/ci-record/*/; do python adapters/stdlib/ci/ci.py verify --box "$d" || exit 1; done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-tests-${{ matrix.python-version }}
          path: ${{ runner.temp }}/ci-record/*/record.jsonl
      - if: github.event_name != 'pull_request' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: test-times
          path: ${{ runner.temp }}/junit/*.xml

  strip:
    # tests:strip, test_strip.py: the repo without GitHub, then without any
    # add-on, each still passing. Four gates, tests:strip-1 to -4, each a
    # share of the add-ons' tests in the stripped copy. One job on each
    # Python, the four run at once by cores.py, as the tests job does.
    needs: [queued, lint, against, changelog]
    if: ${{ !failure() && !cancelled() && needs.queued.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # A pull request runs the oldest and newest Python; main's commit
        # runs all six.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"python-version":"3.10"},{"python-version":"3.11"},{"python-version":"3.12"},{"python-version":"3.13"}]') || fromJSON('[]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python adapters/stdlib/ci/cores.py --jobs 4 --box ${{ runner.temp }}/ci-record tests:strip | tee "$RUNNER_TEMP/ci.log"
      - if: failure()
        run: python adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/ci.log" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: for d in "$RUNNER_TEMP"/ci-record/*/; do python adapters/stdlib/ci/ci.py verify --box "$d" || exit 1; done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-strip-${{ matrix.python-version }}
          path: ${{ runner.temp }}/ci-record/*/record.jsonl

  ports:
    needs: [queued, lint, against, changelog]
    if: ${{ !failure() && !cancelled() && needs.queued.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - uses: dtolnay/rust-toolchain@stable
      - run: python adapters/stdlib/ci/ci.py run ports --box ${{ runner.temp }}/ci-record | tee "$RUNNER_TEMP/ci.log"
      - if: failure()
        run: python adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/ci.log" --record "$RUNNER_TEMP/ci-record/record.jsonl" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-ports
          path: ${{ runner.temp }}/ci-record/record.jsonl

  demo:
    needs: [queued, lint, against, changelog]
    if: ${{ !failure() && !cancelled() && needs.queued.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # pytest: php2shell's freeze check and Bernadette's stack are pytest files;
      # pdf's pins, so the stack reads her PDFs as a person with it installed would
      - run: pip install pytest -r adapters/deps/pdf/requirements.txt
      - run: python adapters/stdlib/ci/ci.py run demo --box ${{ runner.temp }}/ci-record | tee "$RUNNER_TEMP/ci.log"
      - if: failure()
        run: python adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/ci.log" --record "$RUNNER_TEMP/ci-record/record.jsonl" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-demo
          path: ${{ runner.temp }}/ci-record/record.jsonl

  mutants:
    # Each stdlib add-on's code broken on purpose, a few ways, and its tests
    # run against each break: a break the tests miss fails, unless
    # adapters/stdlib/mutants/accepted.json gives the reason it's harmless.
    # Cut in four by ci.py's --shard, each add-on in one of them: the gates
    # take seconds each, so a cut by count ends the four about together.
    # Main's commit runs all of them (in the merge queue, or on the push
    # when the queue didn't test it), so the merge's receipt is whole and is
    # the record mutants-reach below stands a pull request's gates on; a
    # pull request runs mutants-reach instead (github.py check holds the two
    # to the whole part).
    needs: [queued, lint]
    if: ${{ github.event_name != 'pull_request' && !failure() && !cancelled() && needs.queued.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python adapters/stdlib/ci/ci.py run mutants --shard ${{ matrix.shard }}/4 --box ${{ runner.temp }}/ci-record | tee "$RUNNER_TEMP/ci.log"
      - if: failure()
        run: python adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/ci.log" --record "$RUNNER_TEMP/ci-record/record.jsonl" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-record/record.jsonl

  mutants-reach:
    # The gates it runs go through cores.py, four at once: a change to the
    # contract tests reaches every mutants gate, and the whole part in one
    # job took most of an hour where four shards took a quarter of it.
    # The mutants part on a pull request: four shards of 5 to 19 minutes were
    # its slowest job, though a change usually touches one add-on and only
    # that add-on's gate, plus the repo tools' (whose reach is the whole
    # tree), can see it. So this runs only the gates adapters/stdlib/ci-memo
    # says the change reaches, and the rest stand on main's last green run:
    # that run's mutants records are pinned against its own tree, checked out
    # beside this one, and planned against this tree. A gate whose reach
    # holds the same bytes as main's keeps main's verdict; this job's record
    # holds only what it ran, never main's verdicts, and the summary names
    # the run they are from. The merge's evidence stays whole, since main's
    # commit runs every gate (the mutants job, in the queue or on the push).
    # Never silent, never short: with no green run of main, no artifact to
    # download, or a pin ci-memo refuses (the records are of another tree),
    # this job runs the whole part, and says why in the summary.
    # not changelog: it skips Dependabot's pull requests, and a skipped need
    # would skip this job with it
    needs: [lint, against]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 3.13, the Python main's mutants run on: a pin made under another
      # Python stands nothing.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      - id: plan
        # Writes the gates to run, one line, to gates.txt, and touches whole
        # when it fell back to the whole part. ci-memo's plan exits 42 when
        # gates need running and 0 when none do; both go on, anything else
        # falls back.
        run: |
          fallback() {
            {
              echo "### mutants: the whole part runs here"
              echo "Nothing stands on main's run, because $1"
            } >> "$GITHUB_STEP_SUMMARY"
            touch "$RUNNER_TEMP/whole"
            exit 0
          }
          # main's push run, or the queue's run of its commit when the push stood on it
          found=$(python adapters/stdlib/ci/main_run.py --repo "$GITHUB_REPOSITORY" --artifact 'ci-record-mutants-*' 2> "$RUNNER_TEMP/main.err") || fallback "no run of main's holds its mutants records: $(cat "$RUNNER_TEMP/main.err")"
          read -r id sha <<< "$found"
          [ -n "${sha:-}" ] || fallback "main has no successful ci run."
          gh run download "$id" --repo "$GITHUB_REPOSITORY" -p 'ci-record-mutants-*' -D "$RUNNER_TEMP/main-records" || fallback "main's run $id has no mutants records to download (expired, say)."
          boxes=()
          for d in "$RUNNER_TEMP"/main-records/*/; do boxes+=(--box "$d"); done
          [ "${#boxes[@]}" -gt 0 ] || fallback "main's run $id held no mutants records."
          # the tree main's records were made from, beside this one
          git worktree add --detach "$RUNNER_TEMP/main-tree" "$sha" || fallback "main's commit $sha isn't in this checkout."
          python adapters/stdlib/ci-memo/ci_memo.py pin --repo "$RUNNER_TEMP/main-tree" "${boxes[@]}" --to "$RUNNER_TEMP/ci.pin" 2> "$RUNNER_TEMP/pin.err" || fallback "ci-memo refused the pin: $(cat "$RUNNER_TEMP/pin.err")"
          set +e
          python adapters/stdlib/ci-memo/ci_memo.py plan --pin "$RUNNER_TEMP/ci.pin" mutants > "$RUNNER_TEMP/plan.txt" 2> "$RUNNER_TEMP/plan.err"
          code=$?
          set -e
          if [ "$code" != 0 ] && [ "$code" != 42 ]; then
            fallback "ci-memo refused the plan: $(cat "$RUNNER_TEMP/plan.err")"
          fi
          python adapters/stdlib/ci-memo/ci_memo.py plan --pin "$RUNNER_TEMP/ci.pin" --bare mutants > "$RUNNER_TEMP/gates.txt" || [ $? = 42 ]
          {
            echo "### mutants: what this change reaches"
            echo "A \`stand\` row is the verdict of main's run $id, at $sha (adapters/stdlib/ci-memo); a \`run\` row runs in this job."
            echo '```'
            cat "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - id: run
        run: |
          gates=$(cat "$RUNNER_TEMP/gates.txt" 2>/dev/null || true)
          if [ -f "$RUNNER_TEMP/whole" ]; then
            python adapters/stdlib/ci/cores.py --jobs 4 --box ${{ runner.temp }}/ci-record mutants | tee "$RUNNER_TEMP/ci.log"
          elif [ -z "$gates" ]; then
            echo "No mutants gate is reached by this change: every one stands on main's run, so none ran here and no record is written." >> "$GITHUB_STEP_SUMMARY"
            echo "ran=no" >> "$GITHUB_OUTPUT"
          else
            python adapters/stdlib/ci/cores.py --jobs 4 --box ${{ runner.temp }}/ci-record $gates | tee "$RUNNER_TEMP/ci.log"
          fi
      - if: failure()
        run: python adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/ci.log" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always() && steps.run.outputs.ran != 'no'
        run: for d in "$RUNNER_TEMP"/ci-record/*/; do python adapters/stdlib/ci/ci.py verify --box "$d" || exit 1; done
      - if: always() && steps.run.outputs.ran != 'no'
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-mutants-reach
          path: ${{ runner.temp }}/ci-record/*/record.jsonl

  deps:
    # Each add-on in adapters/deps gets a fresh virtual environment with only
    # its own pinned requirements, made by ci.py, then another at its floor;
    # deps:floors checks each floor against PyPI, and deps:advisories every
    # pin against its advisories, by pip-audit. mcp needs Python 3.10+.
    # The programs a deps add-on runs and PyPI doesn't carry come from the
    # runner's Ubuntu: tesseract for ocr, bubblewrap for kart (gpg, for pgp,
    # comes with the image). Ubuntu 24.04 keeps unprivileged user namespaces
    # behind AppArmor, and bwrap needs one, so this runner lets them be made.
    # On a pull request, main's last deps record is fetched first: a gate
    # whose key (its folder, kernel.py, ci.py, the guard, its pins, the
    # Python) has a satisfied verdict there is held, not reinstalled. A push
    # to main fetches nothing and runs every gate, so a bad hold is caught on
    # the next merge; a record that can't be fetched holds nothing.
    needs: [queued, lint, against, changelog]
    if: ${{ !failure() && !cancelled() && needs.queued.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pip install pip-audit==2.10.1
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        # main's green runs only (its push run, or the queue's run of the
        # commit it stood on), by adapters/stdlib/ci/main_run.py: never an
        # artifact found by name, which a pull request from a fork's own main
        # could have uploaded
        run: |
          read -r id _ <<< "$(python adapters/stdlib/ci/main_run.py --repo "$GITHUB_REPOSITORY" --artifact ci-record-deps || true)"
          if [ -n "${id:-}" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n ci-record-deps -D "$RUNNER_TEMP/held" 2>/dev/null; then
            echo "held by main's deps record, run $id"
            echo "WILLOW_HELD_RECORD=$RUNNER_TEMP/held/record.jsonl" >> "$GITHUB_ENV"
          fi
          [ -f "$RUNNER_TEMP/held/record.jsonl" ] || echo "no deps record from main to hold by: every deps gate runs"
      - run: python adapters/stdlib/ci/ci.py run deps --box ${{ runner.temp }}/ci-record | tee "$RUNNER_TEMP/ci.log"
      - if: failure()
        run: python adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/ci.log" --record "$RUNNER_TEMP/ci-record/record.jsonl" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-deps
          path: ${{ runner.temp }}/ci-record/record.jsonl

  tools:
    # The programs the way-in add-ons are for, each run on the lines its
    # add-on prints (adapters/stdlib/live/live.py). Pinned, so a run says
    # which version read them; one that didn't install is unreachable, and
    # an unreachable gate fails this job: nothing here passes unchecked.
    needs: [queued, lint, against, changelog]
    if: ${{ !failure() && !cancelled() && needs.queued.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish emacs-nox vim neovim
      - run: >-
          npm install --global --no-fund --no-audit
          @openai/codex@0.164.0 @google/gemini-cli@0.65.0 opencode-ai@1.19.4
          @github/copilot@1.0.103 @anthropic-ai/claude-code@2.1.310
          @modelcontextprotocol/inspector@2.12.0
      # google-chrome, for the chrome check, comes with the runner's image:
      # its version is the image's, not pinned here like the rest.
      - run: python adapters/stdlib/ci/ci.py run tools --box ${{ runner.temp }}/ci-record | tee "$RUNNER_TEMP/ci.log"
      - if: failure()
        run: python adapters/stdlib/ci-why/ci_why.py "$RUNNER_TEMP/ci.log" --record "$RUNNER_TEMP/ci-record/record.jsonl" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: python adapters/stdlib/ci/ci.py verify --box ${{ runner.temp }}/ci-record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-record-tools
          path: ${{ runner.temp }}/ci-record/record.jsonl

  red-on-main:
    # A red pull request's failing checks held to main's last push run that
    # kept its records: one red on main too is said not to be this change's,
    # one green there is, in the run's summary, so nobody chases main's own
    # failure as theirs (adapters/stdlib/red-on-main). It runs only on a red
    # pull request, and says nothing when main's records can't be fetched.
    needs: [lint, tests, strip, ports, demo, mutants-reach, deps, tools]
    if: ${{ failure() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v7
        with:
          pattern: ci-record-*
          path: ${{ runner.temp }}/pr
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main's push run, or the queue's run of its commit when the push stood on it
          read -r id sha <<< "$(python adapters/stdlib/ci/main_run.py --repo "$GITHUB_REPOSITORY" --artifact 'ci-record-*' || true)"
          if [ -z "${id:-}" ] || ! gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'ci-record-*' -D "$RUNNER_TEMP/main" 2>/dev/null; then
            sha=""
          fi
          if [ -n "$sha" ]; then
            { echo '### Red on main too?'; echo; echo '```'
              python adapters/stdlib/red-on-main/red_on_main.py --pr "$RUNNER_TEMP/pr" --main "$RUNNER_TEMP/main" --main-sha "$sha" || true
              echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no record of main's to hold the failing checks to" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
