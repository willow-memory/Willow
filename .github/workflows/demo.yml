name: demo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  characters:
    # Each life is rebuilt from its seeded generator and held to its PLANTED.md.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        character: [odile, hollis, teodora]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python demo/${{ matrix.character }}/make_life.py
      - run: python demo/${{ matrix.character }}/make_life.py --check
