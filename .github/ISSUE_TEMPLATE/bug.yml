name: Something is wrong
description: The kernel or an add-on did something it shouldn't, or didn't do what its card says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for writing it up. If it's a way to forge an approval, rewrite
        the record, read the key or slip past the guard, use the security
        form instead: SECURITY.md says what counts.
  - type: input
    id: what
    attributes:
      label: Which part
      description: kernel.py, or the add-on's folder (adapters/stdlib/notes)
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What you ran, and what it did
      description: The command, its exit code (0, 42 or 2) and what it printed. Leave out anything from your own files you'd rather not share.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and system
      description: python --version, and your operating system
    validations:
      required: true
